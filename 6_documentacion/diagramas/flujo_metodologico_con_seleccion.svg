<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1645" viewBox="0 0 1500 1645">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="750" y="72" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#17394d" text-anchor="middle">Flujo metodológico · experimento Mendeley</text>
<rect x="95" y="105" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#6b7f8a" stroke-width="4"/>
<circle cx="160" cy="175.0" r="38" fill="#6b7f8a"/>
<text x="160" y="187.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">0</text>
<text x="226" y="163" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Selección y balanceo de imágenes</text>
<text x="226" y="209" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">4,390 fotos originales; 3 estados → 2 clases; aumento de datos hasta 4,000 por clase.</text>
<path d="M750 247 V273" stroke="#5f7a89" stroke-width="5"/><path d="M734 269 L766 269 L750 291 Z" fill="#5f7a89"/>
<rect x="95" y="295" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#dd861a" stroke-width="4"/>
<circle cx="160" cy="365.0" r="38" fill="#dd861a"/>
<text x="160" y="377.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="226" y="353" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Preparación de datos</text>
<text x="226" y="399" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">Se registran la ruta y la clase de las 8,000 fotos.</text>
<path d="M750 437 V463" stroke="#5f7a89" stroke-width="5"/><path d="M734 459 L766 459 L750 481 Z" fill="#5f7a89"/>
<rect x="95" y="485" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#c8930b" stroke-width="4"/>
<circle cx="160" cy="555.0" r="38" fill="#c8930b"/>
<text x="160" y="567.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="226" y="543" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Preparación del experimento</text>
<text x="226" y="589" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">Las fotos se dividen en 5 folds y se configuran los 10 modelos.</text>
<path d="M750 627 V653" stroke="#5f7a89" stroke-width="5"/><path d="M734 649 L766 649 L750 671 Z" fill="#5f7a89"/>
<rect x="95" y="675" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#5154a1" stroke-width="4"/>
<circle cx="160" cy="745.0" r="38" fill="#5154a1"/>
<text x="160" y="757.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="226" y="733" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Entrenamiento</text>
<text x="226" y="779" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">Cada modelo aprende en cada fold y se guarda su mejor versión (50 en total).</text>
<path d="M750 817 V843" stroke="#5f7a89" stroke-width="5"/><path d="M734 839 L766 839 L750 861 Z" fill="#5f7a89"/>
<rect x="95" y="865" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#a42b69" stroke-width="4"/>
<circle cx="160" cy="935.0" r="38" fill="#a42b69"/>
<text x="160" y="947.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="226" y="923" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Evaluación con fotos no vistas</text>
<text x="226" y="969" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">La mejor versión clasifica el 20 % reservado para el examen.</text>
<path d="M750 1007 V1033" stroke="#5f7a89" stroke-width="5"/><path d="M734 1029 L766 1029 L750 1051 Z" fill="#5f7a89"/>
<rect x="95" y="1055" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#a42b69" stroke-width="4"/>
<circle cx="160" cy="1125.0" r="38" fill="#a42b69"/>
<text x="160" y="1137.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="226" y="1113" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Reunir resultados</text>
<text x="226" y="1159" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">Se juntan los 5 folds: 8,000 respuestas por modelo, una por foto.</text>
<path d="M750 1197 V1223" stroke="#5f7a89" stroke-width="5"/><path d="M734 1219 L766 1219 L750 1241 Z" fill="#5f7a89"/>
<rect x="95" y="1245" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#148f87" stroke-width="4"/>
<circle cx="160" cy="1315.0" r="38" fill="#148f87"/>
<text x="160" y="1327.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="226" y="1303" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Comparación y selección</text>
<text x="226" y="1349" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">Se comparan F1, AUC, estabilidad y tamaño; se eligen 2 modelos.</text>
<path d="M750 1387 V1413" stroke="#5f7a89" stroke-width="5"/><path d="M734 1409 L766 1409 L750 1431 Z" fill="#5f7a89"/>
<rect x="95" y="1435" width="1310" height="140" rx="18" fill="#f4f8fa" stroke="#148f87" stroke-width="4"/>
<circle cx="160" cy="1505.0" r="38" fill="#148f87"/>
<text x="160" y="1517.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="226" y="1493" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#17394d">Documentación y trazabilidad</text>
<text x="226" y="1539" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#3d5566">Tablas, gráficas y registros respaldan cada número.</text>
</svg>